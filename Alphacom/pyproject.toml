[project]
name = "alphacom-platform"
version = "0.1.0"
description = "Customer Entitlement & Support Case API, plus an MCP server for the Support Copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "mcp>=1.12",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "openapi-core>=0.19",
]
demo = [
    "openai>=1.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", ".", "mcp"]

[tool.uv]
package = false
