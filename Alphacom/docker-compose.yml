# One image for the API, migrations, the mock upstreams and the sample receiver.
# Only "api" builds it; the others reuse it (pull_policy: never stops compose trying a registry).
x-app: &app
  image: alphacom-platform:local
  pull_policy: never

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alphacom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev-password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    ports:
      - "55432:5432"  # unusual host port so it doesn't clash with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alphacom"]
      interval: 2s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://postgres:postgres-dev-password@postgres:5432/alphacom
    depends_on:
      postgres:
        condition: service_healthy

  upstreams:
    <<: *app
    command: ["uvicorn", "mocks.app:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 3s
      retries: 20

  webhook-receiver:
    <<: *app
    command: ["uvicorn", "examples.webhook_receiver:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      WEBHOOK_SECRETS: whsec_local_demo_secret
    ports:
      - "9000:9000"

  api:
    <<: *app
    build: .
    pull_policy: build
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://api:api-dev-password@postgres:5432/alphacom
      CASESYS_URL: http://upstreams:8081/casesys
      ENTITLEMENT_URL: http://upstreams:8081/entitlement
      WAREHOUSE_URL: http://upstreams:8081/warehouse
      SEED_WEBHOOK_URL: http://webhook-receiver:9000/hooks
      SEED_WEBHOOK_SECRET: whsec_local_demo_secret
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      upstreams:
        condition: service_healthy
      webhook-receiver:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 3s
      retries: 20

volumes:
  pg-data:
